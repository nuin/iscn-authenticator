[project]
name = "iscn-validator-api"
version = "1.0.0"
description = "ISCN Karyotype Validator API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3,<0.144.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "pydantic>=2.14.1,<3.0.0",
    "iscn-authenticator>=0.2.1,<0.3.0",
]

[dependency-groups]
dev = ["httpx2>=2.13.1,<3.0.0"]

[tool.uv.sources]
iscn-authenticator = { url = "https://github.com/nuin/iscn-authenticator-py/archive/58f5a26aa94ac8e30744b5a02b062408d410f193.tar.gz" }
