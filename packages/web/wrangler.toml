#:schema node_modules/wrangler/config-schema.json
name = "iscn-web"
compatibility_date = "2026-10-16"
compatibility_flags = ["nodejs_als"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "iscn-db"
database_id = "0f8fe4e8-a80b-4063-9cc5-1054d3d8b961"

[[services]]
binding = "MAILER"
service = "iscn-email"

[vars]
# Axiom for structured logs
# AXIOM_API_TOKEN = ""
# AXIOM_DATASET = ""
# Stripe
# STRIPE_SECRET_KEY = ""
# STRIPE_WEBHOOK_SECRET = ""
# STRIPE_PRICE_ID_PRO = ""
# PUBLIC_BASE_URL = ""
