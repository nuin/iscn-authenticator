name: CI

on:
  push:
    branches:
      - master
      - milestone-0-library-consolidation
      - milestone-1-security-hardening
      - milestone-2-monetization
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  api-tests:
    name: Python API tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          working-directory: api
          python-version: ${{ matrix.python-version }}
      - name: Test API wrapper with locked dependencies
        run: uv run --project api --locked --python ${{ matrix.python-version }} python -W error -m unittest discover -s api/tests -v

  typescript-tests:
    name: TypeScript tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Type-check @iscn/core
        working-directory: packages/core
        run: deno check --unstable-sloppy-imports src/index.ts
      - name: Type-check Deno app
        working-directory: deno
        run: deno task check
      - name: Fetch shared fixtures from iscn-authenticator-py
        working-directory: packages/core
        run: npm run fetch-fixtures
      - name: Run core fixture, parser, and explanation tests
        working-directory: packages/core
        run: npm run test:deno
      - name: Run Deno app tests
        working-directory: deno
        env:
          SESSION_SECRET: ci_test_session_secret_32_bytes_min_length_ok
          STRIPE_WEBHOOK_SECRET: whsec_ci_test_dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_PRICE_ID_PRO: price_ci_dummy
          PUBLIC_BASE_URL: http://localhost:8000
        run: deno task test

  node-build-smoke:
    name: Node tests, build, and browser bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        working-directory: packages/core
        run: npm ci --ignore-scripts
      - name: Build @iscn/core
        working-directory: packages/core
        run: npm run build
      - name: Run Node tests
        working-directory: packages/core
        run: npm run test:node
      - name: Check embedded browser bundle is current
        working-directory: packages/core
        run: npm run check:browser
      - name: Smoke test built package
        working-directory: packages/core
        run: |
          node --input-type=module -e "
          import { isValidKaryotypeNative } from './dist/index.js';
          const ok = isValidKaryotypeNative('46,XX');
          if (ok !== true) {
            console.error('Expected true, got', ok);
            process.exit(1);
          }
          console.log('Smoke test passed: isValidKaryotypeNative(\"46,XX\") === true');
          "

  web-build:
    name: Web app types, build, and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install core dependencies
        working-directory: packages/core
        run: npm ci --ignore-scripts
      - name: Build @iscn/core
        working-directory: packages/core
        run: npm run build
      - name: Install web dependencies
        working-directory: packages/web
        run: npm ci --ignore-scripts
      - name: Check generated Cloudflare binding types are current
        working-directory: packages/web
        run: npm run types:cloudflare -- --check
      - name: Check generated email binding types are current
        working-directory: packages/web
        run: npm run types:email -- --check
      - name: Type-check web app
        working-directory: packages/web
        run: npm run check
      - name: Build web app
        working-directory: packages/web
        run: npm run build
      - name: Run web integration tests
        working-directory: packages/web
        run: npm test
      - name: Install Chromium for browser tests
        working-directory: packages/web
        run: npx playwright install --with-deps chromium
      - name: Run web browser tests
        working-directory: packages/web
        run: npm run test:browser
