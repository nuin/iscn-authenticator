name: CI

on:
  push:
    branches:
      - master
      - milestone-0-library-consolidation
      - milestone-1-security-hardening
      - milestone-2-monetization
  pull_request:
    branches: [master]

jobs:
  typescript-tests:
    name: TypeScript tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Type-check @iscn/core
        working-directory: packages/core
        run: deno check --unstable-sloppy-imports src/index.ts
      - name: Type-check Deno app
        working-directory: deno
        run: deno task check
      - name: Set up Node.js for fetch-fixtures
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch shared fixtures from iscn-authenticator-py
        working-directory: packages/core
        run: node scripts/fetch-fixtures.mjs
      - name: Run fixture-driven tests
        working-directory: packages/core
        run: deno test --allow-read --unstable-sloppy-imports tests/
      - name: Run Deno app tests (auth, ratelimit, keys, integration)
        working-directory: deno
        env:
          SESSION_SECRET: ci_test_session_secret_32_bytes_min_length_ok
          STRIPE_WEBHOOK_SECRET: whsec_ci_test_dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_PRICE_ID_PRO: price_ci_dummy
          PUBLIC_BASE_URL: http://localhost:8000
        run: deno task test

  node-build-smoke:
    name: Node build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: packages/core
        run: npm ci --ignore-scripts
      - name: Build @iscn/core
        working-directory: packages/core
        run: npm run build
      - name: Smoke test built package
        working-directory: packages/core
        run: |
          node --input-type=module -e "
          import { isValidKaryotypeNative } from './dist/index.js';
          const ok = isValidKaryotypeNative('46,XX');
          if (ok !== true) {
            console.error('Expected true, got', ok);
            process.exit(1);
          }
          console.log('Smoke test passed: isValidKaryotypeNative(\"46,XX\") === true');
          "

  web-build:
    name: Web app check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install core dependencies
        working-directory: packages/core
        run: npm ci --ignore-scripts
      - name: Build @iscn/core
        working-directory: packages/core
        run: npm run build
      - name: Install web dependencies
        working-directory: packages/web
        run: npm ci --ignore-scripts
      - name: Type-check web app
        working-directory: packages/web
        run: npm run check
      - name: Build web app
        working-directory: packages/web
        run: npm run build
